format = """
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status
$character
"""

right_format = "$cmd_duration"

add_newline = false
command_timeout = 1000

[directory]
truncation_length = 20
truncate_to_repo = false
before_repo_root_style = 'cyan'
repo_root_style = 'bold cyan'
truncation_symbol = '.../'

[git_branch]
style = 'bold green'
format = '[$symbol$branch(:$remote_branch) ]($style)'

[git_commit]
style = 'green'
format = '[(\($tag\) )]($style)'
tag_symbol = ''
only_detached = false
tag_disabled = false

[git_state]
style = 'bold red'

[git_status]
style = 'yellow'
format = '([$ahead_behind$all_status ]($style))'
diverged = '[⇕⇡${ahead_count}⇣${behind_count} ](green)'
ahead = '[⇡${count} ](green)'
behind = '[⇣${count} ](green)'
stashed = '[*${count} ](green)'
conflicted = '[=${count} ](red)'
modified = '!${count} '
staged = '+${count} '
renamed = '»${count} '
untracked = '?${count} '
deleted = '✘${count} '

[cmd_duration]
style = 'yellow'
